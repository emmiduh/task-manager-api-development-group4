version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/taskmanager_db
      SPRING_DATASOURCE_USERNAME: mark
      SPRING_DATASOURCE_PASSWORD: Admin@123
    depends_on:
      - db

  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_DB: taskmanager_dbe
      POSTGRES_USER: mark
      POSTGRES_PASSWORD: Admin@123
    ports:
      - "5432:5432"